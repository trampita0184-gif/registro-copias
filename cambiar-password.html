<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cambiar contraseña · Registro de Copias</title><link rel="stylesheet" href="css/styles.css"></head><body><main class="login-screen"><div class="login-card"><h1>🔐 Cambiar contraseña</h1><div class="sub">Debes cambiar tu contraseña temporal antes de continuar.</div><form id="f"><div class="field"><label>Nueva contraseña</label><input id="p1" type="password" minlength="8" required></div><div class="field"><label>Confirmar nueva contraseña</label><input id="p2" type="password" minlength="8" required></div><div class="login-error" id="e"></div><button class="btn" id="b">Guardar nueva contraseña</button></form></div></main><script src="supabase.js"></script><script>(async()=>{const e=document.getElementById('e'),b=document.getElementById('b');try{await window.__supabaseReady;if(!(await restoreSession())){location.replace('login.html');return;}await cargarEstadoCambioPassword();if(!necesitaCambiarPassword()){location.replace('index.html');return;}document.getElementById('f').onsubmit=async x=>{x.preventDefault();const a=document.getElementById('p1').value,c=document.getElementById('p2').value;if(a.length<8){e.textContent='La nueva contraseña debe tener al menos 8 caracteres.';return;}if(a!==c){e.textContent='Las contraseñas no coinciden.';return;}b.disabled=true;try{await cambiarPassword(a);location.replace('index.html');}catch(err){e.textContent=err.message||'No se pudo cambiar la contraseña.';}finally{b.disabled=false;}}}catch(err){e.textContent='No se pudo cargar el servicio.';}})();</script></body></html>
